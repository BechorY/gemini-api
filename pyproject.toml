[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-tool"
version = "0.1.0"
description = "CLI + helper wrapper around HanaokaYuzu/Gemini-API (gemini_webapi)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gemini_webapi>=2.1,<3", "google-genai>=1.0"]

[project.optional-dependencies]
browser = ["gemini_webapi[browser]>=2.1,<3"]
dev = ["pytest>=8"]

[project.scripts]
gemini-cli = "gemini_tool.cli:main"

[tool.setuptools]
packages = ["gemini_tool"]
